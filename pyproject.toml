[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleansplit"
version = "0.1.0"
description = "Local-first stem separation with artifact-aware, mixture-consistent analysis and restoration"
requires-python = ">=3.10"
license = { text = "MIT (CleanSplit code only; model weights carry their own terms)" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Torch is optional: analysis of precomputed stems, metrics and tests do not need it.
separation = [
    "torch>=2.3",
    "einops>=0.7",
    "rotary-embedding-torch>=0.5",
]
# The desktop app: a local FastAPI server plus a WebView2 window. Nothing here reaches the network.
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pywebview>=5",
]
dev = ["pytest>=8", "httpx>=0.27"]  # httpx backs starlette's TestClient

[project.scripts]
cleansplit = "cleansplit.cli.main:main"

[tool.setuptools.packages.find]
include = ["cleansplit*"]

[tool.setuptools.package-data]
"cleansplit.separation.bs_roformer" = ["LICENSE_MSST.txt"]

[tool.pytest.ini_options]
testpaths = ["cleansplit/tests"]
markers = [
    "gpu: requires CUDA and the local BS-RoFormer SW checkpoint",
    "slow: long-running",
]
