[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleansplit"
version = "0.1.0"
description = "Local-first stem separation with artifact-aware, mixture-consistent analysis and restoration"
requires-python = ">=3.10"
license = { text = "MIT (CleanSplit code only). third_party/apollo is CC BY-SA 4.0 and vendored model code is MIT/BSD-3; see LICENSE. Model weights are not redistributed and carry their own terms." }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Torch is optional: analysis of precomputed stems, metrics and tests do not need it.
separation = [
    "torch>=2.3",
    "einops>=0.7",
    "rotary-embedding-torch>=0.5",
]
# The desktop app: a local FastAPI server plus a WebView2 window. Nothing here reaches the network.
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pywebview>=5",
]
dev = ["pytest>=8", "httpx>=0.27"]  # httpx backs starlette's TestClient

[project.scripts]
cleansplit = "cleansplit.cli.main:main"

[tool.setuptools.packages.find]
include = ["cleansplit*"]

[tool.setuptools.package-data]
"cleansplit.separation.bs_roformer" = ["LICENSE_MSST.txt"]

[tool.pytest.ini_options]
testpaths = ["cleansplit/tests"]
markers = [
    "gpu: requires CUDA and the local BS-RoFormer SW checkpoint",
    "slow: long-running",
]

[tool.ruff]
line-length = 130
target-version = "py310"
# Vendored upstream model code is kept byte-for-byte so it can be diffed against its source; linting it would mean
# editing it. See LICENSE and third_party/README.md for provenance.
extend-exclude = [
    "cleansplit/separation/bs_roformer",
    "cleansplit/separation/mdx23c",
    "cleansplit/separation/scnet",
    "third_party",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI's Depends() in a default argument is the framework's documented idiom
    "B023",    # loop-variable capture: every instance here is a closure consumed inside the same iteration
    "RUF046",  # int() around a value already typed int reads as an assertion of intent in the DSP code
    "SIM108",  # ternaries are not always clearer than an if/else in numeric code
    "E741",    # `l` and `I` are conventional in the DSP code, where they track paper notation
    "E731",    # short assigned lambdas are the house style in the experiment scripts
    "SIM115",  # the probes deliberately hold a handle open across a long-running measurement
    "RUF059",  # unpacking and ignoring a field documents the shape of what a function returns
    "B007",    # an unused loop variable is often the clearest way to say "repeat n times"
    "RUF001",  # the UI labels and docs deliberately use real typography -- x, -, <= are the ASCII lookalikes, not
               # the other way round, and "2x faster" in a user-facing string should render as the multiplication sign
]

# B905 (zip without explicit strict=) is deliberately NOT ignored. Silent truncation to the shorter sequence is exactly
# the failure that produced the by-position pairing bug in docs/04 section 14.7, and in a project whose output is
# measurements, a zip that quietly drops a song is a wrong number rather than a crash. Every zip in first-party code
# passes strict=True, so a shape mismatch raises instead of being averaged away.

[tool.ruff.lint.per-file-ignores]
"cleansplit/tests/*" = ["B017", "SIM117"]   # tests deliberately assert on broad exceptions and nest context managers
"tools/*" = ["E402"]                        # experiment scripts must set sys.path before importing the package
"tools/dev/*" = ["E402"]
# The asset generator is dense plotting code where one statement per axis reads better as one line than as three;
# it produces no library API and nothing imports it.
"tools/render/make_readme_assets.py" = ["E701", "E702"]
