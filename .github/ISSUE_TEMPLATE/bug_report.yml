name: Bug report
description: Something behaves differently from what the docs or a measurement says
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: What you ran and what it did. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected, description: If a doc or a number in docs/04_results.md says otherwise, link it. }
    validations: { required: true }
  - type: textarea
    id: command
    attributes: { label: Exact command, render: shell }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: OS, Python, GPU and VRAM, placeholder: "Windows 11, 3.11, RTX 2080 Super Max-Q 8 GB" }
    validations: { required: true }
