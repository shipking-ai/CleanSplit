name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format github

  test:
    # Torch is an optional extra and the tests do not need it, so CI installs neither torch nor any model weights.
    # What runs here is the 83 non-GPU tests; the 10 GPU-marked ones need an 8 GB card and local checkpoints, and are
    # run by hand before release (see HANDOFF.md).
    name: tests ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -e ".[dev,ui]"
      - name: Run the non-GPU suite
        env:
          PYTHONIOENCODING: utf-8
        run: pytest cleansplit/tests -q -m "not gpu"
