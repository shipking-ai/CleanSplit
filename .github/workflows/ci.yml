name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Deny everything by default and let each job opt in to exactly what it needs. Nothing here writes to the repository.
permissions: {}

concurrency:
  # The pull_request.number suffix keeps a branch push and its open PR in separate groups, so pushing to a branch does
  # not cancel the PR run that is about to report a status.
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # otherwise the token is written into .git/config for every later step
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check --output-format github

  test:
    # Torch is an optional extra and the tests do not need it, so CI installs neither torch nor any model weights.
    # What runs here is the non-GPU suite; the 10 GPU-marked tests need an 8 GB card, and the two that need the real
    # checkpoint FILES skip themselves when the weights are absent (see test_separator_gpu.py::_skip_without_weights),
    # which is why a clone with no models still gets a green `pytest`.
    name: tests ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Runner images are pinned on purpose. `ubuntu-latest` becomes 26.04 during October 2026, and in a repository
        # whose output is measurements the environment is part of the record -- it should move when we move it.
        os: [ubuntu-24.04, windows-2025]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # REQUIRED, and its absence made this matrix a lie: with no python-version, setup-uv provisions nothing and
          # `uv pip install --system` targets whatever interpreter the image ships. Both py3.10 legs were measured
          # running 3.12 (3.12.10 on Windows, 3.12.3 on Ubuntu), so the 3.10 floor was never actually tested.
          python-version: ${{ matrix.python }}
      - name: Install into a venv
        # A venv rather than --system: Ubuntu's image Python is PEP 668 externally-managed, so `uv pip install --system`
        # failed outright there ("The interpreter at /usr is externally managed") and both Ubuntu legs ran no tests at
        # all while the workflow still went red for unrelated reasons. `uv venv` honours the version pinned above.
        # --clear because setup-uv may already have created .venv when it provisioned the interpreter, and a bare
        # `uv venv` then aborts with "A virtual environment already exists" -- on Ubuntu but not Windows.
        # The interpreter is printed so the matrix is verifiable from the log rather than assumed; that assumption is
        # exactly what hid both py3.10 legs running 3.12.
        run: |
          uv venv --clear
          uv pip install -e ".[dev,ui]"
          uv run --no-sync python -c "import sys; print('interpreter:', sys.version)"
      - name: Run the non-GPU suite
        env:
          PYTHONIOENCODING: utf-8   # the dB and delta output in the CLI and tests is non-ASCII
        run: uv run --no-sync pytest cleansplit/tests -q -m "not gpu"
