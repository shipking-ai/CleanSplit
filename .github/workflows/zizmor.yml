name: zizmor

# Static analysis of the workflows themselves. Added because the CI workflow had been quietly wrong for a while --
# a matrix that pinned two Python versions and tested one, and an install step that failed outright on Ubuntu -- and
# because a workflow is the one file in the repository that runs with a credential attached. zizmor covers the class of
# mistake that review misses: template injection from ${{ github.event.* }}, tokens persisted into .git/config,
# over-broad permissions, dangerous triggers. It is what ruff, uv, pydantic and black all run.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: workflow security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      security-events: write   # SARIF upload to the Security tab (needs a public repo or Code Security)
      contents: read
      actions: read            # zizmor's online audits read workflow/action metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        # SARIF now goes to the Security tab: the repository went public on 2026-09-28, which is what code scanning
        # uploads require (they need Code Security on a private repo). Findings appear as code-scanning alerts with
        # history, instead of scrolling past in a job log.
